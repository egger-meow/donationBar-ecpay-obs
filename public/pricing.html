<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DonationBar 方案與價格</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --surface: #0b1120;
      --surface-2: #111a2e;
      --border: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(148, 163, 184, 0.28);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #34d399;
      --accent-strong: #10b981;
      --accent-dim: rgba(52, 211, 153, 0.12);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 50% 40% at 50% 0%, rgba(16, 185, 129, 0.1) 0%, transparent 65%),
        radial-gradient(ellipse 40% 30% at 90% 90%, rgba(56, 189, 248, 0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    main { width: min(100%, 640px); position: relative; z-index: 1; }

    a { color: var(--accent); }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 22px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.15s ease;
    }
    .back:hover { color: var(--accent); }

    .card {
      background: linear-gradient(180deg, rgba(17, 26, 46, 0.9), rgba(11, 17, 32, 0.95));
      border: 1px solid var(--border-strong);
      border-radius: 22px;
      padding: clamp(28px, 5vw, 44px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(16, 185, 129, 0.06);
      animation: rise 0.6s var(--ease) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(52, 211, 153, 0.35);
      border-radius: 999px;
      padding: 5px 14px;
      margin: 0 0 14px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 6vw, 40px);
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .lede { color: var(--text-muted); line-height: 1.7; margin: 0; }

    .price {
      font-size: clamp(40px, 9vw, 58px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      margin: 26px 0 2px;
      background: linear-gradient(120deg, var(--accent) 0%, #6ee7b7 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .unit { font-size: 15px; color: var(--text-muted); }

    ul {
      padding: 0;
      margin: 24px 0 0;
      list-style: none;
      line-height: 1.9;
    }

    ul li {
      padding-left: 28px;
      position: relative;
      margin: 8px 0;
    }

    ul li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 7px;
      width: 16px;
      height: 16px;
      background-color: var(--accent);
      -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>') center / contain no-repeat;
      mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>') center / contain no-repeat;
    }

    .notice {
      margin-top: 24px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 13.5px;
    }

    .action {
      display: inline-block;
      margin-top: 26px;
      background: linear-gradient(135deg, var(--accent-strong), var(--accent));
      color: #022c22;
      font-weight: 900;
      padding: 15px 26px;
      border-radius: 14px;
      text-decoration: none;
      box-shadow: 0 6px 24px rgba(16, 185, 129, 0.28);
      transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease);
    }

    .action:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(16, 185, 129, 0.4);
    }

    .action:focus-visible {
      outline: 3px solid rgba(52, 211, 153, 0.55);
      outline-offset: 3px;
    }

    footer {
      margin-top: 22px;
      color: var(--text-dim);
      font-size: 13.5px;
      text-align: center;
    }
    footer a { color: var(--text-muted); text-decoration: none; }
    footer a:hover { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/login">← 回到 DonationBar</a>
    <section class="card" aria-labelledby="pricing-title">
      <p class="badge">邀請制封閉測試</p>
      <h1 id="pricing-title">DonationBar Pro</h1>
      <p class="lede">給台灣實況主的 ECPay 斗內頁與 OBS 瀏覽器來源提示 — 固定月費、不抽成，收得越多留下越多。</p>
      <div class="price" id="price" aria-live="polite">載入價格中…</div>
      <div class="unit">每月，自動續訂；可隨時取消後續續扣。</div>
      <ul>
        <li id="trial">載入試用資訊中…</li>
        <li>一個工作區的 ECPay 斗內頁與 OBS Overlay</li>
        <li>即時斗內進度與提示</li>
        <li>由 ECPay 處理平台訂閱付款</li>
      </ul>
      <div class="notice">目前價格僅用於封閉測試與價值驗證，並非公開上市承諾。正式價格、稅務與電子發票安排會在法律及會計審查完成後確認。</div>
      <a class="action" href="/api/auth/google">以 Google 登入並加入測試</a>
    </section>
    <footer><a href="/terms.html">服務條款</a> · <a href="/privacy.html">隱私權政策</a></footer>
  </main>
  <script>
    async function loadPricing() {
      const response = await fetch('/api/pricing', { headers: { Accept: 'application/json' } });
      if (!response.ok) throw new Error('pricing_unavailable');
      const pricing = await response.json();
      if (!Number.isInteger(pricing.monthlyPrice) || pricing.monthlyPrice < 1 || !Number.isInteger(pricing.trialDays) || pricing.trialDays < 1) throw new Error('pricing_invalid');
      document.getElementById('price').textContent = `NT$ ${pricing.monthlyPrice}`;
      document.getElementById('trial').textContent = `新用戶享 ${pricing.trialDays} 天免費試用`;
    }
    loadPricing().catch(() => {
      document.getElementById('price').textContent = '價格暫時無法載入';
      document.getElementById('trial').textContent = '請稍後再試，或聯絡支援團隊';
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>支持直播 - 斗內</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --surface: #0b1120;
      --surface-2: #111a2e;
      --border: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(148, 163, 184, 0.28);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #34d399;
      --accent-strong: #10b981;
      --accent-dim: rgba(52, 211, 153, 0.12);
      --danger: #f87171;
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { color-scheme: dark; }

    body {
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.6;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 40% at 50% 0%, rgba(16, 185, 129, 0.09) 0%, transparent 65%),
        radial-gradient(ellipse 40% 30% at 85% 90%, rgba(56, 189, 248, 0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    .container {
      background: linear-gradient(180deg, rgba(17, 26, 46, 0.85), rgba(11, 17, 32, 0.95));
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 36px 32px;
      border-radius: 22px;
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
      animation: rise 0.6s var(--ease) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: center;
      margin-bottom: 6px;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.01em;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 26px;
      font-size: 14.5px;
    }

    .donation-banner {
      display: none;
      width: 100%;
      aspect-ratio: 920 / 130;
      object-fit: cover;
      object-position: center;
      border-radius: 16px;
      margin-bottom: 26px;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    /* ===== Progress hero ===== */
    .progress-preview {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 26px;
    }

    .progress-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
    }

    .progress-title strong {
      font-size: 15.5px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .progress-percent {
      color: var(--accent);
      font-weight: 900;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .progress-bar {
      width: 100%;
      height: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-strong), #6ee7b7);
      border-radius: 999px;
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.45);
      transition: width 0.6s var(--ease);
    }

    .progress-amounts {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 6px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      font-size: 13.5px;
    }

    .progress-amounts .current {
      color: var(--accent);
      font-size: 20px;
      font-weight: 900;
    }

    /* ===== Alerts ===== */
    .message {
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-weight: 500;
      font-size: 14px;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .message svg { width: 20px; height: 20px; flex-shrink: 0; }
    .message.visible { display: flex; }

    .success-message {
      background: var(--accent-dim);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: var(--accent);
    }

    .error-message {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: var(--danger);
    }

    /* ===== Form ===== */
    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 13.5px;
      color: var(--text);
    }

    label .optional {
      font-weight: 400;
      color: var(--text-dim);
      font-size: 12.5px;
      margin-left: 4px;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    input::placeholder, textarea::placeholder { color: var(--text-dim); }

    textarea { resize: vertical; min-height: 76px; }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.18);
    }

    .char-hint {
      font-size: 12px;
      color: var(--text-dim);
      text-align: right;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .amount-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .amount-btn {
      min-height: 46px;
      padding: 10px 8px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-muted);
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      font-variant-numeric: tabular-nums;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, transform 0.15s var(--ease);
    }

    .amount-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .amount-btn:focus-visible {
      outline: 3px solid rgba(52, 211, 153, 0.55);
      outline-offset: 2px;
    }

    .amount-btn.active {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.18);
    }

    .donate-btn {
      width: 100%;
      min-height: 56px;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-strong), #34d399);
      border: none;
      color: #022c22;
      font-size: 17px;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease), opacity 0.18s ease;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 24px rgba(16, 185, 129, 0.28);
    }

    .donate-btn svg { width: 20px; height: 20px; }

    .donate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(16, 185, 129, 0.4);
    }

    .donate-btn:active { transform: translateY(0); }

    .donate-btn:focus-visible {
      outline: 3px solid rgba(52, 211, 153, 0.55);
      outline-offset: 3px;
    }

    .donate-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .form-error {
      color: var(--danger);
      font-size: 13px;
      font-weight: 500;
      margin-top: 8px;
      display: none;
    }
    .form-error.visible { display: block; }

    .footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--text-dim);
    }
    .footer p { margin-bottom: 4px; }
    .footer a { color: var(--text-muted); text-decoration: none; }
    .footer a:hover { color: var(--accent); }

    .secure-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
      color: var(--text-muted);
    }
    .secure-note svg { width: 14px; height: 14px; color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 480px) {
      .container { padding: 28px 20px; }
      h1 { font-size: 23px; }
      .amount-buttons { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>支持這個直播</h1>
    <p class="subtitle">你的斗內會即時出現在直播畫面上</p>

    <div id="successMessage" class="message success-message" role="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
      <span>感謝您的支持！付款已完成，進度條馬上就會更新。</span>
    </div>

    <div id="errorMessage" class="message error-message" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>付款過程中發生錯誤，請重試。若持續失敗，可換一張卡或稍後再試。</span>
    </div>

    <img id="donationBanner" class="donation-banner" alt="">

    <section class="progress-preview" id="progressPreview" aria-live="polite">
      <div class="progress-title">
        <strong id="goalTitle">載入中…</strong>
        <span class="progress-percent"><span id="progressPercent">0</span>%</span>
      </div>
      <div class="progress-bar" role="progressbar" aria-labelledby="goalTitle" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-amounts">
        <span class="current">NT$ <span id="currentAmount">0</span></span>
        <span>/ NT$ <span id="goalAmount">0</span></span>
      </div>
    </section>

    <form id="donationForm" method="post" action="/create-order">
      <div class="form-group">
        <label for="nickname">暱稱<span class="optional">（可選，會顯示在直播畫面上）</span></label>
        <input type="text" id="nickname" name="nickname" placeholder="想被實況主看到的名字" maxlength="20" autocomplete="nickname">
      </div>

      <div class="form-group">
        <label for="message">留言<span class="optional">（可選）</span></label>
        <textarea id="message" name="message" placeholder="想對實況主說的話…" maxlength="100" rows="3"></textarea>
        <div class="char-hint"><span id="messageCount">0</span>/100</div>
      </div>

      <div class="form-group">
        <label for="amount">斗內金額（NT$）</label>
        <input type="number" id="amount" name="amount" min="1" max="999999" value="100" required inputmode="numeric">

        <div class="amount-buttons" role="group" aria-label="常用金額">
          <button type="button" class="amount-btn" data-amount="50">NT$ 50</button>
          <button type="button" class="amount-btn active" data-amount="100">NT$ 100</button>
          <button type="button" class="amount-btn" data-amount="200">NT$ 200</button>
          <button type="button" class="amount-btn" data-amount="500">NT$ 500</button>
          <button type="button" class="amount-btn" data-amount="1000">NT$ 1,000</button>
          <button type="button" class="amount-btn" data-amount="2000">NT$ 2,000</button>
        </div>
        <div class="form-error" id="amountError" role="alert"></div>
      </div>

      <button type="submit" class="donate-btn" id="donateBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        <span id="donateBtnText">前往綠界安全付款</span>
      </button>
    </form>

    <div class="footer">
      <p class="secure-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        由綠界 ECPay 金流處理，支援信用卡付款
      </p>
      <p>付款完成後會自動更新直播進度條</p>
      <p><a href="/terms.html">服務條款</a> · <a href="/privacy.html">隱私權政策</a></p>
    </div>
  </main>

  <script>
    // Extract workspace slug from URL path (/donate/:slug)
    function getWorkspaceSlug() {
      const match = window.location.pathname.match(/^\/donate\/([^\/]+)$/);
      return match ? match[1] : null; // null means use default workspace
    }

    const workspaceSlug = getWorkspaceSlug();

    // Elements
    const donationBanner = document.getElementById('donationBanner');
    const form = document.getElementById('donationForm');
    const amountInput = document.getElementById('amount');
    const amountButtons = document.querySelectorAll('.amount-btn');
    const donateBtn = document.getElementById('donateBtn');
    const donateBtnText = document.getElementById('donateBtnText');
    const successMessage = document.getElementById('successMessage');
    const errorMessage = document.getElementById('errorMessage');
    const amountError = document.getElementById('amountError');
    const messageInput = document.getElementById('message');
    const messageCount = document.getElementById('messageCount');

    // Progress elements
    const goalTitle = document.getElementById('goalTitle');
    const currentAmount = document.getElementById('currentAmount');
    const goalAmount = document.getElementById('goalAmount');
    const progressPercent = document.getElementById('progressPercent');
    const progressFill = document.getElementById('progressFill');
    const progressTrack = document.getElementById('progressTrack');

    // Check URL parameters for success/error messages
    const urlParams = new URLSearchParams(window.location.search);

    if (urlParams.get('success') === '1') {
      successMessage.classList.add('visible');
      window.scrollTo(0, 0);
      document.title = '付款成功 - 支持直播';
    }
    if (urlParams.get('error') === '1') {
      errorMessage.classList.add('visible');
      window.scrollTo(0, 0);
    }

    function renderProgress(data) {
      const percent = Math.max(0, Math.min(100, Number(data.percent) || 0));
      goalTitle.textContent = data.title || '斗內目標';
      currentAmount.textContent = formatNumber(data.current);
      goalAmount.textContent = formatNumber(data.goal);
      progressPercent.textContent = Number(data.percent) || 0;
      progressFill.style.width = `${percent}%`;
      progressTrack.setAttribute('aria-valuenow', String(percent));

      if (data.bannerImage) {
        donationBanner.src = data.bannerImage;
        donationBanner.style.display = 'block';
      } else {
        donationBanner.removeAttribute('src');
        donationBanner.style.display = 'none';
      }
    }

    // Load current progress
    async function loadProgress() {
      try {
        const url = workspaceSlug ? `/progress?slug=${encodeURIComponent(workspaceSlug)}` : '/progress';
        const response = await fetch(url);
        const data = await response.json();
        renderProgress(data);
      } catch (error) {
        console.error('Failed to load progress:', error);
        goalTitle.textContent = '斗內目標';
      }
    }

    function formatNumber(num) {
      return new Intl.NumberFormat(navigator.language).format(Number(num) || 0);
    }

    // Add slug to form if workspace-specific URL
    if (workspaceSlug) {
      const slugInput = document.createElement('input');
      slugInput.type = 'hidden';
      slugInput.name = 'slug';
      slugInput.value = workspaceSlug;
      form.appendChild(slugInput);
    }

    // Amount button handlers
    amountButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        amountButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        amountInput.value = btn.dataset.amount;
        amountError.classList.remove('visible');
      });
    });

    // Custom amount input handler — sync active state with presets
    amountInput.addEventListener('input', () => {
      const currentValue = parseInt(amountInput.value);
      let hasActiveButton = false;

      amountButtons.forEach(btn => {
        if (parseInt(btn.dataset.amount) === currentValue) {
          amountButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          hasActiveButton = true;
        }
      });

      if (!hasActiveButton) {
        amountButtons.forEach(b => b.classList.remove('active'));
      }
      amountError.classList.remove('visible');
    });

    // Message character counter
    messageInput.addEventListener('input', () => {
      messageCount.textContent = String(messageInput.value.length);
    });

    function showAmountError(text) {
      amountError.textContent = text;
      amountError.classList.add('visible');
      amountInput.focus();
    }

    // Form submission
    form.addEventListener('submit', (e) => {
      const amount = parseInt(amountInput.value);

      if (!amount || amount < 1) {
        e.preventDefault();
        showAmountError('請輸入有效的斗內金額（至少 NT$1）。');
        return;
      }

      if (amount > 999999) {
        e.preventDefault();
        showAmountError('單次斗內金額不能超過 NT$999,999。');
        return;
      }

      // Show loading state
      donateBtn.disabled = true;
      donateBtnText.textContent = '前往綠界中…';

      // Form will submit normally to /create-order
    });

    // Initialize
    loadProgress();

    // Real-time updates via SSE - use workspace-specific endpoint if slug is present
    const eventsUrl = workspaceSlug ? `/events?slug=${encodeURIComponent(workspaceSlug)}` : '/events';
    const eventSource = new EventSource(eventsUrl);
    eventSource.onmessage = function(event) {
      try {
        renderProgress(JSON.parse(event.data));
      } catch (error) {
        console.error('Error parsing SSE data:', error);
      }
    };
  </script>
</body>
</html>

name = "donatio"
main = "src/worker.js"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# Static Assets served directly by Cloudflare edge
[assets]
directory = "./public"
binding = "ASSETS"

# Default non-secret runtime configuration
[vars]
ENVIRONMENT = "staging"
BASE_URL = "https://donatio-staging.jjmowlab.com"
GOOGLE_CALLBACK_URL = "https://donatio-staging.jjmowlab.com/api/auth/google/callback"
ECPAY_ENVIRONMENT = "stage"
NODE_ENV = "production"

# Top-level Hyperdrive binding for local/default development
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "58a070df7a8942d885af5c19c9902bb3"

# Staging Environment (Deploy first: npx wrangler deploy --env staging)
[env.staging]
name = "donatio-staging"
routes = [
  { pattern = "donatio-staging.jjmowlab.com", custom_domain = true }
]
[env.staging.vars]
ENVIRONMENT = "staging"
BASE_URL = "https://donatio-staging.jjmowlab.com"
GOOGLE_CALLBACK_URL = "https://donatio-staging.jjmowlab.com/api/auth/google/callback"
ECPAY_ENVIRONMENT = "stage"
NODE_ENV = "production"

# Hyperdrive bindings are non-inheritable across named environments
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "58a070df7a8942d885af5c19c9902bb3"

# Production Environment (Deploy after staging verification passes: npx wrangler deploy --env production)
[env.production]
name = "donatio-production"
routes = [
  { pattern = "donatio.jjmowlab.com", custom_domain = true }
]
[env.production.vars]
ENVIRONMENT = "production"
BASE_URL = "https://donatio.jjmowlab.com"
GOOGLE_CALLBACK_URL = "https://donatio.jjmowlab.com/api/auth/google/callback"
ECPAY_ENVIRONMENT = "production"
NODE_ENV = "production"

# Hyperdrive bindings are non-inheritable across named environments
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "0aaf2f2f7cfb4dc99eec44545fa58651"
